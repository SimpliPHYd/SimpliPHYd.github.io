<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Trainer Pro - Multiplayer 3D Cycling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .metric-value { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; }
        .hidden-view { display: none !important; }
        
        #editorCanvas { cursor: crosshair; touch-action: none; }
        #scene3d { width: 100%; height: 350px; background: #000; border-radius: 0.75rem; overflow: hidden; position: relative;}
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 gap-6">

    <!-- Header -->
    <div class="w-full max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-cyan-500">
            Virtual Trainer Pro
        </h1>
        
        <!-- Global Device Pairing -->
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 text-sm bg-slate-900/50 px-3 py-1.5 rounded-lg border border-slate-700">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></div>
                <span id="statusText" class="font-mono text-xs text-slate-300">Disconnected</span>
            </div>
            <button id="btnConnectTrainer" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-lg shadow transition-all">Connect Trainer</button>
            <button id="btnDisconnectTrainer" class="px-4 py-1.5 bg-red-600 hover:bg-red-500 text-white text-sm font-semibold rounded-lg shadow transition-all hidden">Disconnect</button>
        </div>
    </div>

    <!-- Loading State -->
    <div id="loadingView" class="w-full flex-1 flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-green-500"></div>
    </div>

    <!-- Landing View -->
    <div id="landingView" class="hidden-view w-full max-w-xl mx-auto flex-1 flex flex-col justify-center gap-6">
        <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 text-center shadow-2xl">
            <h2 class="text-2xl font-bold mb-2">Start a Session</h2>
            <button id="btnCreateSession" class="w-full px-6 py-3 bg-green-600 hover:bg-green-500 text-white font-semibold rounded-xl transition-all">Create New Ride</button>
            <div class="my-6 border-t border-slate-700 relative">
                <span class="absolute left-1/2 -translate-x-1/2 -top-3 bg-slate-800 px-2 text-slate-400 text-sm">OR</span>
            </div>
            <h2 class="text-xl font-bold mb-2">Join Session</h2>
            <div class="flex gap-2">
                <input type="text" id="inputSessionId" placeholder="SESSION ID" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-center uppercase tracking-widest" maxlength="6">
                <button id="btnJoinSession" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-semibold transition-all">Join</button>
            </div>
            <div id="joinError" class="text-red-400 text-sm mt-2 hidden"></div>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="hidden-view w-full max-w-7xl mx-auto flex-col gap-6">
        
        <!-- Controls & Bluetooth -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-wrap justify-between items-center gap-4 shadow-lg">
            <div class="flex items-center gap-3">
                <button id="btnStartRide" class="px-4 py-1.5 bg-green-600 hover:bg-green-500 text-white text-sm font-semibold rounded-lg shadow transition-all">Start Ride</button>
                <button id="btnPauseRide" class="hidden px-4 py-1.5 bg-orange-600 hover:bg-orange-500 text-white text-sm font-semibold rounded-lg shadow transition-all">Pause Ride</button>
                <button id="btnStopRide" class="hidden px-4 py-1.5 bg-red-600 hover:bg-red-500 text-white text-sm font-semibold rounded-lg shadow transition-all">Stop & Export</button>
                <span class="text-slate-400 text-sm ml-2 border-l border-slate-600 pl-4">Session:</span>
                <span id="displaySessionId" class="text-white font-bold tracking-widest font-mono bg-slate-900 px-3 py-1 rounded">---</span>
                <button id="btnResetRide" class="text-sm text-yellow-400 hover:text-yellow-300 ml-4 hidden px-3 py-1 bg-slate-700 rounded font-semibold transition-all">Reset Ride</button>
                <button id="btnLeave" class="text-sm text-red-400 hover:text-red-300 ml-2">Leave</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Column: Settings & Editor -->
            <div class="lg:col-span-1 flex flex-col gap-4">
                
                <!-- Trainer Control Config -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
                    <h3 class="font-bold text-lg mb-3">Trainer Control</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Mode</label>
                            <select id="ctrlMode" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm">
                                <option value="resistance">Simulation (Resistance)</option>
                                <option value="erg">Auto-Power (ERG)</option>
                            </select>
                        </div>
                        <div id="panelResistance">
                            <label class="block text-sm text-slate-400 mb-1">Difficulty: <span id="diffVal">50</span>%</label>
                            <input type="range" id="ctrlDifficulty" min="0" max="100" value="50" class="w-full mb-4">
                            
                            <label class="block text-sm text-slate-400 mb-1">Load GPX Route</label>
                            <input type="file" id="gpxFileInput" accept=".gpx" class="block w-full text-xs text-slate-400
                              file:mr-4 file:py-1 file:px-3
                              file:rounded-full file:border-0
                              file:text-xs file:font-semibold
                              file:bg-slate-700 file:text-slate-200
                              hover:file:bg-slate-600 bg-slate-900 border border-slate-600 rounded-lg cursor-pointer">
                              
                            <div id="ghostRiderContainer" class="hidden mt-3 p-3 bg-slate-900/50 rounded-lg border border-purple-500/30 flex items-center justify-between">
                                <label for="toggleGhost" class="text-sm font-semibold text-purple-400 cursor-pointer">Race GPX Ghost</label>
                                <input type="checkbox" id="toggleGhost" class="w-4 h-4 accent-purple-500 cursor-pointer">
                            </div>
                        </div>
                        <div id="panelErg" class="hidden">
                            <label class="block text-sm text-slate-400 mb-1">Max Power (W)</label>
                            <input type="number" id="ctrlMaxPower" value="400" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm">
                        </div>
                    </div>
                </div>

                <!-- Track Editor -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex-1 flex flex-col">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-lg">Track Editor</h3>
                        <div class="flex items-center gap-2">
                            <label id="editorLabel" class="text-xs text-slate-400">Length (km):</label>
                            <input type="number" id="trackLengthInput" value="10" min="1" max="100" class="w-16 bg-slate-900 border border-slate-600 rounded p-1 text-xs text-center">
                        </div>
                    </div>
                    <div class="relative w-full aspect-[4/3] bg-slate-900 rounded-lg border border-slate-700 overflow-hidden">
                        <canvas id="editorCanvas" class="absolute inset-0 w-full h-full"></canvas>
                    </div>
                    
                    <!-- New ERG Duration Controls -->
                    <div id="ergDurationControls" class="hidden mt-3 flex flex-col gap-2">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-slate-400">Interval Durations (min)</span>
                            <div class="flex gap-1" id="ergButtonsGroup">
                                <button id="btnRemoveErg" class="px-2 py-1 bg-red-900/50 hover:bg-red-800 text-red-400 rounded transition-colors">-</button>
                                <button id="btnAddErg" class="px-2 py-1 bg-green-900/50 hover:bg-green-800 text-green-400 rounded transition-colors">+</button>
                            </div>
                        </div>
                        <div id="ergDurationInputs" class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                            <!-- Inputs injected here -->
                        </div>
                    </div>

                    <p id="editorHelperText" class="text-[10px] text-slate-500 mt-2 text-center">Drag nodes vertically to adjust elevation. Synced to all riders.</p>
                </div>

            </div>

            <!-- Right Column: 3D View & Metrics -->
            <div class="lg:col-span-2 flex flex-col gap-4">
                
                <!-- 3D Environment -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-1 shadow-lg">
                    <div id="scene3d">
                        <!-- Stats Overlay -->
                        <div class="absolute top-4 left-4 bg-slate-900/80 border border-slate-600 rounded-lg p-3 shadow-lg z-10 flex flex-col gap-1 pointer-events-none">
                            <div class="flex justify-between items-center gap-4">
                                <span class="text-xs text-slate-400 uppercase font-semibold">Grade</span>
                                <span id="displayGrade" class="text-sm font-bold font-mono text-blue-400">0.0%</span>
                            </div>
                            <div class="flex justify-between items-center gap-4">
                                <span id="labelResistance" class="text-xs text-slate-400 uppercase font-semibold">Resistance</span>
                                <span id="displayResistance" class="text-sm font-bold font-mono text-orange-400">0%</span>
                            </div>
                        </div>
                        <!-- Minimap Overlay -->
                        <canvas id="minimapCanvas" class="absolute bottom-4 right-4 w-[250px] h-20 bg-slate-900/80 border border-slate-600 rounded-lg shadow-lg z-10 cursor-crosshair" width="250" height="80"></canvas>
                        <!-- Top Down GPX Minimap -->
                        <canvas id="topDownCanvas" class="absolute top-4 right-4 w-[150px] h-[150px] bg-slate-900/80 border border-slate-600 rounded-lg shadow-lg z-10 hidden" width="150" height="150"></canvas>
                    </div>
                </div>

                <!-- Multiplayer Metrics Grid -->
                <div id="usersGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Cards injected via JS -->
                </div>

            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        // ==========================================
        // 1. Setup & Initialization
        // ==========================================
        

// Import the functions you need from the SDKs you need



  // TODO: Add SDKs for Firebase products that you want to use

  // https://firebase.google.com/docs/web/setup#available-libraries


  // Your web app's Firebase configuration

  // For Firebase JS SDK v7.20.0 and later, measurementId is optional

  const firebaseConfig = {

    apiKey: "AIzaSyAtx8Q_ATx-ghbx6x2AKbeBNbbaB0DdTcA",

    authDomain: "trainer-ac2ff.firebaseapp.com",

    projectId: "trainer-ac2ff",

    storageBucket: "trainer-ac2ff.firebasestorage.app",

    messagingSenderId: "374862317733",

    appId: "1:374862317733:web:f9c3ad1ac257822f86e54c",

    measurementId: "G-8MV7B19YSV"

  };

  // Initialize Firebase

  
  


        //const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-trainer-app';
        const appId = firebaseConfig.appId;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        // --- Application State ---
        let currentUserId = null;
        let currentSessionId = null;
        let unsubscribeSession = null;
        let isHost = false; // Only host updates track topology

        let activeUsers = {};
        let localMetrics = { power: 0, speed: 0, cadence: 0, distance: 0, gradient: 0, time: 0 };
        let lastSyncTime = 0;
        let syncErrorCount = 0; // Tracks consecutive sync errors
        let isCleaningUp = false; // Prevents double-cleanup on exit
        let lastResetTrigger = 0;
        let isRideActive = false; // Tracks if the ride timer is running
        
        let recordedData = [];
        let lastRecordTime = 0;
        let gpxTimestamps = []; // Stores the timing profile for the ghost
        let isGhostEnabled = false;

        // Default Track (10 points, X normalized 0-1, Y is elevation in meters 0-500)
        let trackData = {
            mode: 'resistance',
            lengthKm: 10,
            resetTrigger: 0,
            isGpxLoaded: false,
            points: Array.from({length: 11}, (_, i) => ({ x: i / 10, y: 50 })),
            ergSegments: [{ powerPct: 50, durationMin: 5 }]
        };

        // --- Auth Init ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUserId = auth.currentUser.uid;
                document.getElementById('loadingView').classList.add('hidden-view');
                document.getElementById('landingView').classList.remove('hidden-view');
                initEditor();
                init3D();
            } catch (error) {
                console.error("Auth error", error);
                document.getElementById('loadingView').innerHTML = `<div class="text-red-500">Auth Failed.</div>`;
            }
        }

        // --- Session Management ---
        const docPath = () => doc(db, 'artifacts', appId, 'public', 'data', 'sessions', currentSessionId);

        document.getElementById('btnCreateSession').onclick = async () => {
            currentSessionId = Math.random().toString(36).substring(2, 8).toUpperCase();
            isHost = true;
            document.getElementById('btnResetRide').classList.remove('hidden');
            try {
                await setDoc(docPath(), {
                    trackData: trackData,
                    users: { [currentUserId]: { ...localMetrics, updatedAt: Date.now() } }
                });
                enterSession();
            } catch (e) { console.error(e); }
        };

        document.getElementById('btnJoinSession').onclick = async () => {
            const val = document.getElementById('inputSessionId').value.trim().toUpperCase();
            if(val.length !== 6) return;
            currentSessionId = val;
            isHost = false;
            document.getElementById('btnResetRide').classList.add('hidden');
            try {
                const snap = await getDoc(docPath());
                if (!snap.exists()) throw new Error("Session not found");
                await setDoc(docPath(), { users: { [currentUserId]: { ...localMetrics, updatedAt: Date.now() } } }, { merge: true });
                enterSession();
            } catch (e) { 
                const err = document.getElementById('joinError');
                err.textContent = "Error joining: Check Firebase Rules/Quota";
                err.classList.remove('hidden');
                console.error("Join error:", e);
            }
        };

        async function cleanupSession() {
            if (!currentSessionId || !currentUserId || isCleaningUp) return;
            isCleaningUp = true;
            const path = docPath();
            
            try {
                // 1. Remove this user from the session
                await updateDoc(path, {
                    [`users.${currentUserId}`]: deleteField()
                });

                // 2. Check if the session is now empty
                const snap = await getDoc(path);
                if (snap.exists()) {
                    const data = snap.data();
                    if (!data.users || Object.keys(data.users).length === 0) {
                        // 3. Delete the empty session document
                        await deleteDoc(path);
                    }
                }
            } catch (e) {
                console.error("Cleanup error", e);
            }
        }

        document.getElementById('btnLeave').onclick = async () => {
            if(unsubscribeSession) unsubscribeSession();
            await cleanupSession(); // Cleanup Firestore before clearing local state
            currentSessionId = null;
            document.getElementById('dashboardView').classList.add('hidden-view');
            document.getElementById('landingView').classList.remove('hidden-view');
        };

        document.getElementById('btnResetRide').onclick = async () => {
            if(!isHost) return;
            trackData.resetTrigger = Date.now();
            isRideActive = false;
            recordedData = [];
            document.getElementById('btnStartRide').classList.remove('hidden');
            document.getElementById('btnPauseRide').classList.add('hidden');
            document.getElementById('btnStopRide').classList.add('hidden');
            await syncLocalData();
        };

        document.getElementById('btnStartRide').onclick = () => {
            isRideActive = true;
            document.getElementById('btnStartRide').classList.add('hidden');
            document.getElementById('btnPauseRide').classList.remove('hidden');
            document.getElementById('btnStopRide').classList.remove('hidden');
        };

        document.getElementById('btnPauseRide').onclick = () => {
            isRideActive = false;
            document.getElementById('btnStartRide').classList.remove('hidden');
            document.getElementById('btnPauseRide').classList.add('hidden');
        };

        document.getElementById('btnStopRide').onclick = () => {
            isRideActive = false;
            document.getElementById('btnStartRide').classList.remove('hidden');
            document.getElementById('btnPauseRide').classList.add('hidden');
            document.getElementById('btnStopRide').classList.add('hidden');
            exportWorkout();
        };

        function exportWorkout() {
            if (recordedData.length === 0) return;

            const startTime = recordedData[0].timestamp.toISOString();
            let tcx = `<?xml version="1.0" encoding="UTF-8"?>
<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:ns3="http://www.garmin.com/xmlschemas/ActivityExtension/v2">
  <Activities>
    <Activity Sport="Biking">
      <Id>${startTime}</Id>
      <Lap StartTime="${startTime}">
        <TotalTimeSeconds>${localMetrics.time}</TotalTimeSeconds>
        <DistanceMeters>${localMetrics.distance * 1000}</DistanceMeters>
        <Intensity>Active</Intensity>
        <TriggerMethod>Manual</TriggerMethod>
        <Track>
`;
            
            recordedData.forEach(pt => {
                tcx += `          <Trackpoint>
            <Time>${pt.timestamp.toISOString()}</Time>
            <DistanceMeters>${(pt.distance * 1000).toFixed(2)}</DistanceMeters>
            <Cadence>${Math.round(pt.cadence)}</Cadence>
            <Extensions>
              <ns3:TPX>
                <ns3:Speed>${(pt.speed / 3.6).toFixed(2)}</ns3:Speed>
                <ns3:Watts>${Math.round(pt.power)}</ns3:Watts>
              </ns3:TPX>
            </Extensions>
          </Trackpoint>
`;
            });

            tcx += `        </Track>
      </Lap>
    </Activity>
  </Activities>
</TrainingCenterDatabase>`;

            const blob = new Blob([tcx], { type: 'application/vnd.garmin.tcx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `VirtualRide_${new Date().getTime()}.tcx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Handle tab close, refresh, or navigation
        window.addEventListener('beforeunload', () => {
            if (currentSessionId) cleanupSession();
        });
        
        window.addEventListener('pagehide', () => {
            if (currentSessionId) cleanupSession();
        });

        function enterSession() {
            document.getElementById('landingView').classList.add('hidden-view');
            document.getElementById('dashboardView').classList.remove('hidden-view');
            document.getElementById('displaySessionId').textContent = currentSessionId;
            document.getElementById('dashboardView').style.display = 'flex'; // override hidden-view class
            
            // Refresh UI state to unlock the dropdown and controls if you are the host
            updateUIForMode();
            renderErgInputs();

            // Resize canvas/3D now that they are visible
            resizeEditor();
            resize3D();

            unsubscribeSession = onSnapshot(docPath(), (snap) => {
                if(snap.exists()) {
                    const data = snap.data();
                    
                    let newUsers = data.users || {};
                    
                    // Loop through network users to manage states and avatars safely
                    Object.keys(newUsers).forEach(uid => {
                        if (uid === currentUserId) {
                            // Be careful NOT to overwrite the local user's current live metrics with stale network data
                            newUsers[currentUserId].distance = localMetrics.distance;
                            newUsers[currentUserId].speed = localMetrics.speed;
                            newUsers[currentUserId].power = localMetrics.power;
                            newUsers[currentUserId].cadence = localMetrics.cadence;
                            newUsers[currentUserId].time = localMetrics.time;
                        } else {
                            // If a new user is detected, create a new 3D avatar sphere for them immediately
                            if (!avatars3D[uid]) {
                                updateAvatar3D(uid, newUsers[uid].distance || 0, false);
                            }
                        }
                    });
                    
                    activeUsers = newUsers;
                    
                    // Handle Global Reset for EVERYONE
                    if (data.trackData && data.trackData.resetTrigger !== lastResetTrigger) {
                        lastResetTrigger = data.trackData.resetTrigger;
                        localMetrics.distance = 0;
                        localMetrics.time = 0;
                        isRideActive = false;
                        recordedData = [];
                        document.getElementById('btnStartRide').classList.remove('hidden');
                        document.getElementById('btnPauseRide').classList.add('hidden');
                        document.getElementById('btnStopRide').classList.add('hidden');
                    }

                    // Sync track data if not host
                    if (!isHost && data.trackData) {
                        const localHash = JSON.stringify(trackData);
                        const remoteHash = JSON.stringify(data.trackData);
                        if (localHash !== remoteHash) {
                            trackData = data.trackData;
                            document.getElementById('trackLengthInput').value = trackData.lengthKm;
                            updateUIForMode();
                            renderErgInputs();
                            drawEditor();
                            rebuild3DTrack();
                        }
                    }
                }
            });

            // Start logic loops
            requestAnimationFrame(gameLoop);
        }

        // --- Multiplayer Sync ---
        function formatTime(s) {
            let m = Math.floor((s || 0) / 60);
            let sec = Math.floor((s || 0) % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        function renderGrid() {
            const grid = document.getElementById('usersGrid');
            grid.innerHTML = '';
            
            Object.entries(activeUsers).forEach(([uid, data]) => {
                const isMe = uid === currentUserId;
                const div = document.createElement('div');
                div.className = `bg-slate-800 rounded-xl p-4 border ${isMe ? 'border-blue-500' : 'border-slate-700'} relative flex flex-col gap-2`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-end mb-2 border-b border-slate-700/50 pb-2">
                        <span class="text-xs text-slate-500 font-mono mb-1">${isMe ? 'YOU' : 'Rider: ' + uid.substring(0,6)}</span>
                        <div class="flex gap-4 items-baseline">
                            <span class="text-xl font-bold font-mono text-slate-200 tracking-wider">${formatTime(data.time)}</span>
                            <span class="text-2xl font-black font-mono text-green-400 tracking-tight">${(data.distance || 0).toFixed(2)}<span class="text-xs font-normal text-green-500/70 ml-1 uppercase">km</span></span>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center items-end">
                        <div>
                            <div class="text-2xl font-bold text-yellow-400 metric-value">${Math.round(data.power || 0)}</div>
                            <div class="text-[10px] uppercase text-slate-500">W</div>
                        </div>
                        <div class="border-x border-slate-700">
                            <div class="text-2xl font-bold text-blue-400 metric-value">${(data.speed || 0).toFixed(1)}</div>
                            <div class="text-[10px] uppercase text-slate-500">km/h</div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-green-400 metric-value">${Math.round(data.cadence || 0)}</div>
                            <div class="text-[10px] uppercase text-slate-500">RPM</div>
                        </div>
                    </div>
                    <div class="w-full bg-slate-900 h-1.5 rounded-full mt-2 overflow-hidden">
                        <div class="bg-blue-500 h-full" style="width: ${Math.min(((data.distance||0)/trackData.lengthKm)*100, 100)}%"></div>
                    </div>
                `;
                isMe ? grid.prepend(div) : grid.appendChild(div);
                
                // Update 3D avatar position
                updateAvatar3D(uid, data.distance || 0, isMe);
            });
        }

        async function syncLocalData() {
            if(!currentSessionId || !currentUserId) return;
            const now = Date.now();
            
            // Dynamic Throttle: 2.5s base, but increases by 5 seconds per consecutive error to prevent backend overload
            const currentThrottle = 2500 + (syncErrorCount * 5000);
            if (now - lastSyncTime < currentThrottle) return; 
            lastSyncTime = now;

            // Uses proper nested object for setDoc with { merge: true } instead of dot notation
            const updatePayload = {
                users: {
                    [currentUserId]: { ...localMetrics, updatedAt: now }
                }
            };
            
            if (isHost) updatePayload.trackData = trackData;

            try {
                await setDoc(docPath(), updatePayload, { merge: true });
                syncErrorCount = 0; // Reset error count on successful sync
            } catch(e) { 
                console.warn("Firebase Sync Error (Backing off)...", e.message); 
                syncErrorCount++;
                
                if(e.code === 'permission-denied') {
                    console.error("PERMISSION DENIED: Did you leave your Firestore Security Rules set to 'if false'?");
                } else if(e.code === 'resource-exhausted') {
                    console.error("QUOTA EXCEEDED: Your daily Firestore quota has run out.");
                }
            }
        }

        // --- 2D Track Editor ---
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        let isDraggingPoint = -1;
        let hoveredErgSegment = -1;
        const MAX_ELEV = 500; // max Y axis in meters

        function updateUIForMode() {

        function renderErgInputs() {

        document.getElementById('btnAddErg').onclick = () => {

        function resizeEditor() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawEditor();
        }
        window.addEventListener('resize', resizeEditor);

        function drawEditor() {
            if(!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Grid
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=1; i<4; i++) {
                let y = (i/4) * canvas.height;
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            for(let i=1; i<10; i++) {
                let x = (i/10) * canvas.width;
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            ctx.stroke();

            if (trackData.mode === 'erg') {
                // ERG Mode: Dynamic Bar Graphs based on duration
                let totalDuration = trackData.ergSegments.reduce((sum, seg) => sum + seg.durationMin, 0) || 1;
                let totalSeconds = totalDuration * 60;
                let currentX = 0;
                let accumSeconds = 0;
                let maxH = canvas.height - 10; // Leave space at bottom for progress bar
                
                trackData.ergSegments.forEach((seg, i) => {
                    let barW = (seg.durationMin / totalDuration) * canvas.width;
                    let barH = (seg.powerPct / 100) * maxH;
                    
                    let segStartSec = accumSeconds;
                    let segEndSec = accumSeconds + (seg.durationMin * 60);
                    
                    let isCompleted = localMetrics.time >= segEndSec;
                    let isActive = localMetrics.time >= segStartSec && localMetrics.time < segEndSec;
                    
                    // Highlight if hovered or being dragged
                    let isHovered = (i === hoveredErgSegment || isDraggingPoint === i);
                    
                    if (isCompleted) {
                        ctx.fillStyle = '#475569'; // Slate grey for completed intervals
                    } else {
                        ctx.fillStyle = isHovered ? `hsl(${120 - seg.powerPct}, 80%, 60%)` : `hsl(${120 - seg.powerPct}, 70%, 50%)`; 
                    }
                    
                    ctx.fillRect(currentX, maxH - barH, barW, barH);
                    
                    if (isActive) {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3;
                    } else {
                        ctx.strokeStyle = '#0f172a';
                        ctx.lineWidth = 2;
                    }
                    ctx.strokeRect(currentX, maxH - barH, barW, barH);
                    
                    // Display height value on hover
                    if (isHovered) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 12px Inter, sans-serif';
                        ctx.textAlign = 'center';
                        // Keep text within canvas bounds
                        let textY = Math.max(16, maxH - barH - 6);
                        ctx.fillText(`${seg.powerPct}%`, currentX + barW / 2, textY);
                    }
                    
                    accumSeconds = segEndSec;
                    currentX += barW;
                });

                // Draw Progress Bar under the graph
                let progress = Math.min(1, localMetrics.time / totalSeconds);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, canvas.height - 6, canvas.width, 6);
                ctx.fillStyle = '#3b82f6'; // Blue progress fill
                ctx.fillRect(0, canvas.height - 6, progress * canvas.width, 6);
                
            } else {
                // Resistance Mode: Spline
                ctx.beginPath();
                ctx.strokeStyle = '#22c55e'; // green-500
                ctx.lineWidth = 3;
                trackData.points.forEach((p, i) => {
                    let px = p.x * canvas.width;
                    let py = canvas.height - (p.y / MAX_ELEV) * canvas.height;
                    if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                });
                ctx.stroke();

                // Points
                ctx.fillStyle = '#3b82f6'; // blue-500
                trackData.points.forEach((p) => {
                    let px = p.x * canvas.width;
                    let py = canvas.height - (p.y / MAX_ELEV) * canvas.height;
                    ctx.beginPath();
                    ctx.arc(px, py, 6, 0, Math.PI*2);
                    ctx.fill();
                    ctx.stroke();
                });
            }
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handlePointerDown(e) {
            if (!isHost) return; // Only host edits
            if (trackData.mode === 'resistance' && trackData.isGpxLoaded) return;
            
            const pos = getMousePos(e);
            
            if (trackData.mode === 'erg') {
                let totalDuration = trackData.ergSegments.reduce((sum, seg) => sum + seg.durationMin, 0) || 1;
                let currentX = 0;
                isDraggingPoint = -1;
                for (let i = 0; i < trackData.ergSegments.length; i++) {
                    let barW = (trackData.ergSegments[i].durationMin / totalDuration) * canvas.width;
                    if (pos.x >= currentX && pos.x <= currentX + barW) {
                        isDraggingPoint = i;
                        updateErgBar(pos.y);
                        break;
                    }
                    currentX += barW;
                }
            } else {
                // Find closest point
                for(let i=0; i<trackData.points.length; i++) {
                    let p = trackData.points[i];
                    let px = p.x * canvas.width;
                    let py = canvas.height - (p.y / MAX_ELEV) * canvas.height;
                    if(Math.hypot(px - pos.x, py - pos.y) < 15) {
                        isDraggingPoint = i;
                        break;
                    }
                }
            }
        }

        function updateErgBar(mouseY) {
            let maxH = canvas.height - 10;
            let newY = (maxH - mouseY) / maxH * 100;
            trackData.ergSegments[isDraggingPoint].powerPct = Math.max(0, Math.min(100, Math.round(newY)));
            drawEditor();
        }

        function handlePointerMove(e) {
            const pos = getMousePos(e);
            
            if (trackData.mode === 'erg') {
                // Track hover state for ERG bars
                let totalDuration = trackData.ergSegments.reduce((sum, seg) => sum + seg.durationMin, 0) || 1;
                let currentX = 0;
                let foundHover = -1;
                
                for (let i = 0; i < trackData.ergSegments.length; i++) {
                    let barW = (trackData.ergSegments[i].durationMin / totalDuration) * canvas.width;
                    if (pos.x >= currentX && pos.x <= currentX + barW) {
                        foundHover = i;
                        break;
                    }
                    currentX += barW;
                }
                
                // Only redraw if the hovered segment changes
                if (hoveredErgSegment !== foundHover) {
                    hoveredErgSegment = foundHover;
                    if (isDraggingPoint === -1) drawEditor();
                }

                if (isDraggingPoint !== -1 && isHost) {
                    updateErgBar(pos.y);
                }
            } else {
                if(isDraggingPoint === -1 || !isHost) return;
                let newY = (canvas.height - pos.y) / canvas.height * MAX_ELEV;
                trackData.points[isDraggingPoint].y = Math.max(0, Math.min(MAX_ELEV, newY));
                drawEditor();
                rebuild3DTrack(); // live preview in 3D
            }
        }

        function handlePointerUp() {
            if(isDraggingPoint !== -1) {
                isDraggingPoint = -1;
                syncLocalData(); // Push change to firebase
            }
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        
        // Touch support
        canvas.addEventListener('touchstart', handlePointerDown, {passive: true});
        canvas.addEventListener('touchmove', handlePointerMove, {passive: true});
        window.addEventListener('touchend', handlePointerUp);

        // Clear hover state when mouse leaves canvas
        canvas.addEventListener('mouseleave', () => {
            hoveredErgSegment = -1;
            if (isDraggingPoint === -1) drawEditor();
        });

        document.getElementById('trackLengthInput').addEventListener('change', (e) => {
            if(!isHost) { e.target.value = trackData.lengthKm; return; }
            trackData.lengthKm = Math.max(1, Math.min(100, parseFloat(e.target.value) || 10));
            rebuild3DTrack();
            syncLocalData();
        });

        function initEditor() { 
            resizeEditor(); 
            updateUIForMode();
            renderErgInputs();
        }

        // --- GPX Support ---
        function haversineDistance(coords1, coords2) {
            const toRad = x => (x * Math.PI) / 180;
            const R = 6371; // km
            const dLat = toRad(coords2.lat - coords1.lat);
            const dLon = toRad(coords2.lon - coords1.lon);
            const lat1 = toRad(coords1.lat);
            const lat2 = toRad(coords2.lat);

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(lat1) * Math.cos(lat2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        document.getElementById('gpxFileInput').addEventListener('change', (e) => {
            if (!isHost) return;
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const gpxText = event.target.result;
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(gpxText, "text/xml");
                
                // Fallback to route points if track points don't exist
                let trkpts = xmlDoc.getElementsByTagName("trkpt");
                if (trkpts.length === 0) {
                    trkpts = xmlDoc.getElementsByTagName("rtept");
                }
                
                if (trkpts.length === 0) {
                    console.error("No track points found in GPX file.");
                    return;
                }

                let totalDist = 0;
                let parsedPoints = [];
                let lastPoint = null;
                
                let hasTimes = true;
                let baseTime = 0;
                gpxTimestamps = [];

                for (let i = 0; i < trkpts.length; i++) {
                    let pt = trkpts[i];
                    let lat = parseFloat(pt.getAttribute("lat"));
                    let lon = parseFloat(pt.getAttribute("lon"));
                    let eleElement = pt.getElementsByTagName("ele")[0];
                    let ele = eleElement ? parseFloat(eleElement.textContent) : 0;
                    
                    let currentPoint = { lat, lon, ele };
                    
                    if (lastPoint) {
                        totalDist += haversineDistance(lastPoint, currentPoint);
                    }
                    
                    let timeElement = pt.getElementsByTagName("time")[0];
                    if (timeElement && timeElement.textContent) {
                        let timeMs = new Date(timeElement.textContent).getTime();
                        if (!isNaN(timeMs)) {
                            if (i === 0 || baseTime === 0) baseTime = timeMs;
                            if (hasTimes) gpxTimestamps.push({ dist: totalDist, timeSec: (timeMs - baseTime) / 1000 });
                        } else {
                            hasTimes = false;
                        }
                    } else {
                        hasTimes = false;
                    }
                    
                    parsedPoints.push({ dist: totalDist, ele: ele, lat: lat, lon: lon });
                    lastPoint = currentPoint;
                }

                if (totalDist < 0.1) totalDist = 0.1;

                // Downsample to max 50 points for the editor/3D performance
                const targetPoints = 50;
                let downsampled = [];
                if (parsedPoints.length > targetPoints) {
                    let step = parsedPoints.length / targetPoints;
                    for (let i = 0; i < targetPoints; i++) {
                        let index = Math.floor(i * step);
                        downsampled.push(parsedPoints[index]);
                    }
                    downsampled.push(parsedPoints[parsedPoints.length - 1]);
                } else {
                    downsampled = parsedPoints;
                }

                // Normalize Elevation to strictly fit the 0-MAX_ELEV visual range
                let minEle = Math.min(...downsampled.map(p => p.ele));
                let maxEle = Math.max(...downsampled.map(p => p.ele));
                let eleRange = maxEle - minEle;
                
                // Prevent flat routes from causing divide-by-zero or looking like cliffs
                if (eleRange < 10) eleRange = 10; 

                let lat0 = downsampled[0].lat;
                let lon0 = downsampled[0].lon;
                let R = 6371; // Earth radius in km

                let mapXs = [];
                let mapZs = [];

                let newPoints = downsampled.map(p => {
                    // Convert GPS coordinates to local X/Z distances in km (Equirectangular projection)
                    let x_km = R * (p.lon - lon0) * (Math.PI / 180) * Math.cos(lat0 * Math.PI / 180);
                    let z_km = R * (p.lat - lat0) * (Math.PI / 180);
                    
                    mapXs.push(x_km);
                    mapZs.push(z_km);

                    return {
                        x: p.dist / totalDist,
                        // Scale to fit comfortably between 20 and 400 (MAX_ELEV is 500)
                        y: 20 + ((p.ele - minEle) / eleRange) * 380,
                        mapX: x_km,
                        mapZ: z_km
                    };
                });

                newPoints[0].x = 0;
                newPoints[newPoints.length - 1].x = 1;

                trackData.lengthKm = parseFloat(totalDist.toFixed(2));
                document.getElementById('trackLengthInput').value = trackData.lengthKm;
                trackData.points = newPoints;
                trackData.gpxBounds = {
                    minX: Math.min(...mapXs), maxX: Math.max(...mapXs),
                    minZ: Math.min(...mapZs), maxZ: Math.max(...mapZs)
                };
                trackData.isGpxLoaded = true;
                
                if (hasTimes && gpxTimestamps.length > 0) {
                    document.getElementById('ghostRiderContainer').classList.remove('hidden');
                } else {
                    document.getElementById('ghostRiderContainer').classList.add('hidden');
                    isGhostEnabled = false;
                    document.getElementById('toggleGhost').checked = false;
                }
                
                drawEditor();
                updateUIForMode();
                rebuild3DTrack();
                syncLocalData();
                
                e.target.value = ""; // Reset input
            };
            reader.readAsText(file);
        });

        document.getElementById('toggleGhost').addEventListener('change', (e) => {
            isGhostEnabled = e.target.checked;
            if(!isGhostEnabled) {
                delete activeUsers['GHOST'];
                if(avatars3D['GHOST']) {
                    scene.remove(avatars3D['GHOST']);
                    delete avatars3D['GHOST'];
                }
                renderGrid();
                drawMinimap();
                drawTopDownMinimap();
            }
        });

        // --- Three.js 3D Environment ---
        let scene, camera, renderer, trackMesh;
        let avatars3D = {};
        const TRACK_SCALE = 1000; // 1km = 1000 3D units

        function init3D() {
            const container = document.getElementById('scene3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 50, 3000);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 5000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 50);
            scene.add(dirLight);

            // Ground plane
            const grid = new THREE.GridHelper(10000, 100, 0x334155, 0x1e293b);
            grid.position.y = 0;
            scene.add(grid);

            rebuild3DTrack();
        }

        function resize3D() {
            if(!renderer) return;
            const container = document.getElementById('scene3d');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        window.addEventListener('resize', resize3D);

        function rebuild3DTrack() {
            if(!scene) return;
            if(trackMesh) scene.remove(trackMesh);

            // Convert 2D points to 3D curve
            const pts3d = trackData.points.map(p => {
                // X in 2D = distance along Z in 3D. 
                // Y in 2D = elevation (Y) in 3D.
                let x = 0;
                let z = -p.x * trackData.lengthKm * TRACK_SCALE; 
                
                // If GPX data is present, apply real-world turns
                if (trackData.isGpxLoaded && p.mapX !== undefined && p.mapZ !== undefined) {
                    x = p.mapX * TRACK_SCALE;
                    z = -p.mapZ * TRACK_SCALE; // Negate Z as North is typically -Z in WebGL
                }
                
                let y = trackData.mode === 'erg' ? 0 : p.y; 
                return new THREE.Vector3(x, y, z);
            });

            const curve = new THREE.CatmullRomCurve3(pts3d, false, 'catmullrom', 0.5);
            const geometry = new THREE.TubeGeometry(curve, 100, 4, 8, false);
            const material = new THREE.MeshLambertMaterial({ color: 0x475569, wireframe: false });
            
            trackMesh = new THREE.Mesh(geometry, material);
            scene.add(trackMesh);
            
            // Store curve for avatar positioning
            scene.userData.curve = curve;
        }

        // Hash string to hex color
        function strToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return '#' + (hash & 0x00FFFFFF).toString(16).padStart(6, '0');
        }

        function updateAvatar3D(uid, distanceKm, isLocal) {
            if(!scene || !scene.userData.curve) return;

            let mesh = avatars3D[uid];
            if(!mesh) {
                const geo = new THREE.SphereGeometry(3, 16, 16);
                let color = isLocal ? 0x22c55e : strToColor(uid);
                if (uid === 'GHOST') color = 0xa855f7; // purple-500
                const mat = new THREE.MeshLambertMaterial({ color: color });
                mesh = new THREE.Mesh(geo, mat);
                scene.add(mesh);
                avatars3D[uid] = mesh;
            }

            // Calculate position along curve
            // Distance fraction 0 to 1
            let t = Math.max(0, Math.min(1, distanceKm / trackData.lengthKm));
            const point = scene.userData.curve.getPointAt(t);
            const tangent = scene.userData.curve.getTangentAt(t);
            
            mesh.position.copy(point);
            mesh.position.y += 3; // Float above track

            if(isLocal) {
                // Camera follows local avatar, looking along the curve's tangent to steer around corners
                const backDir = tangent.clone().negate().multiplyScalar(40); // 40 units behind
                const camPos = point.clone().add(backDir);
                camPos.y += 15; // 15 units up
                
                camera.position.copy(camPos);
                
                const lookPos = point.clone().add(tangent.clone().multiplyScalar(50)); // Look 50 units ahead
                camera.lookAt(lookPos);
            }
        }

        // --- Minimap Overlay ---
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        let minimapHoverX = -1;

        minimapCanvas.addEventListener('mousemove', (e) => {
            const rect = minimapCanvas.getBoundingClientRect();
            minimapHoverX = (e.clientX - rect.left) * (minimapCanvas.width / rect.width);
        });

        minimapCanvas.addEventListener('mouseleave', () => {
            minimapHoverX = -1;
        });

        function drawMinimap() {
            if(!minimapCtx) return;
            const width = minimapCanvas.width;
            const height = minimapCanvas.height;
            minimapCtx.clearRect(0, 0, width, height);

            // Draw track profile
            minimapCtx.beginPath();
            minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            minimapCtx.lineWidth = 3;
            trackData.points.forEach((p, i) => {
                let px = p.x * width;
                let py = height - ((trackData.mode === 'erg' ? 0 : p.y) / MAX_ELEV) * height;
                if(i===0) minimapCtx.moveTo(px, py); else minimapCtx.lineTo(px, py);
            });
            minimapCtx.stroke();

            // Draw avatars on minimap
            Object.entries(activeUsers).forEach(([uid, data]) => {
                const isMe = uid === currentUserId;
                let distFraction = Math.max(0, Math.min(1, (data.distance || 0) / trackData.lengthKm));
                
                // Interpolate Elevation for exact dot placement
                let p1 = trackData.points[0], p2 = trackData.points[0];
                for(let i=0; i<trackData.points.length - 1; i++) {
                    if (distFraction >= trackData.points[i].x && distFraction <= trackData.points[i+1].x) {
                        p1 = trackData.points[i];
                        p2 = trackData.points[i+1];
                        break;
                    }
                }
                
                let rangeX = p2.x - p1.x;
                let localFrac = rangeX === 0 ? 0 : (distFraction - p1.x) / rangeX;
                let interpY = p1.y + (p2.y - p1.y) * localFrac;
                
                if (trackData.mode === 'erg') interpY = 0;

                let px = distFraction * width;
                let py = height - (interpY / MAX_ELEV) * height;

                minimapCtx.beginPath();
                minimapCtx.arc(px, py, isMe ? 5 : 4, 0, Math.PI*2);
                minimapCtx.fillStyle = isMe ? '#22c55e' : strToColor(uid);
                minimapCtx.fill();
                
                if(isMe) {
                    minimapCtx.strokeStyle = '#ffffff';
                    minimapCtx.lineWidth = 1.5;
                    minimapCtx.stroke();
                }
            });

            // Draw hover elevation tooltip
            if (minimapHoverX >= 0) {
                let fraction = minimapHoverX / width;
                fraction = Math.max(0, Math.min(1, fraction));
                
                let p1 = trackData.points[0], p2 = trackData.points[0];
                for(let i=0; i<trackData.points.length - 1; i++) {
                    if (fraction >= trackData.points[i].x && fraction <= trackData.points[i+1].x) {
                        p1 = trackData.points[i];
                        p2 = trackData.points[i+1];
                        break;
                    }
                }
                
                let rangeX = p2.x - p1.x;
                let localFrac = rangeX === 0 ? 0 : (fraction - p1.x) / rangeX;
                
                let interpEle = 0;
                if (trackData.isGpxLoaded && p1.ele !== undefined && p2.ele !== undefined) {
                    interpEle = p1.ele + (p2.ele - p1.ele) * localFrac;
                } else {
                    interpEle = p1.y + (p2.y - p1.y) * localFrac;
                }

                if (trackData.mode === 'erg') interpEle = 0; // ERG is flat

                // Vertical line
                minimapCtx.beginPath();
                minimapCtx.moveTo(minimapHoverX, 0);
                minimapCtx.lineTo(minimapHoverX, height);
                minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                minimapCtx.lineWidth = 1;
                minimapCtx.stroke();

                // Tooltip background and text
                const text = `${Math.round(interpEle)}m`;
                minimapCtx.font = 'bold 10px Inter, sans-serif';
                const textWidth = minimapCtx.measureText(text).width;
                
                let textX = minimapHoverX + 6;
                // Keep tooltip on screen
                if (textX + textWidth > width - 4) {
                    textX = minimapHoverX - textWidth - 6;
                }
                
                minimapCtx.fillStyle = 'rgba(15, 23, 42, 0.8)';
                minimapCtx.fillRect(textX - 4, 4, textWidth + 8, 16);
                minimapCtx.fillStyle = '#ffffff';
                minimapCtx.fillText(text, textX, 15);
            }
        }

        // --- Top Down GPX Minimap ---
        const topDownCanvas = document.getElementById('topDownCanvas');
        const topDownCtx = topDownCanvas.getContext('2d');

        function drawTopDownMinimap() {
            if (!topDownCtx || !trackData.isGpxLoaded || !trackData.gpxBounds) {
                if (topDownCanvas) topDownCanvas.classList.add('hidden');
                return;
            }
            
            topDownCanvas.classList.remove('hidden');

            const width = topDownCanvas.width;
            const height = topDownCanvas.height;
            topDownCtx.clearRect(0, 0, width, height);

            const bounds = trackData.gpxBounds;
            const rangeX = bounds.maxX - bounds.minX || 1;
            const rangeZ = bounds.maxZ - bounds.minZ || 1;
            
            // Scale to fit canvas while maintaining aspect ratio, with 10px padding
            const scale = Math.min((width - 20) / rangeX, (height - 20) / rangeZ);
            const offsetX = (width - (rangeX * scale)) / 2;
            const offsetY = (height - (rangeZ * scale)) / 2;

            function mapToCanvas(x, z) {
                return {
                    cx: offsetX + (x - bounds.minX) * scale,
                    cy: offsetY + (bounds.maxZ - z) * scale // Invert Z so North points UP
                };
            }

            // Draw track path
            topDownCtx.beginPath();
            topDownCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            topDownCtx.lineWidth = 2.5;
            trackData.points.forEach((p, i) => {
                if (p.mapX === undefined || p.mapZ === undefined) return;
                let { cx, cy } = mapToCanvas(p.mapX, p.mapZ);
                if (i === 0) topDownCtx.moveTo(cx, cy);
                else topDownCtx.lineTo(cx, cy);
            });
            topDownCtx.stroke();

            // Draw user avatars
            Object.entries(activeUsers).forEach(([uid, data]) => {
                const isMe = uid === currentUserId;
                let distFraction = Math.max(0, Math.min(1, (data.distance || 0) / trackData.lengthKm));
                
                // Find interpolated mapX, mapZ based on current distance
                let p1 = trackData.points[0], p2 = trackData.points[0];
                for(let i=0; i<trackData.points.length - 1; i++) {
                    if (distFraction >= trackData.points[i].x && distFraction <= trackData.points[i+1].x) {
                        p1 = trackData.points[i];
                        p2 = trackData.points[i+1];
                        break;
                    }
                }
                
                let rangeX_dist = p2.x - p1.x;
                let localFrac = rangeX_dist === 0 ? 0 : (distFraction - p1.x) / rangeX_dist;
                
                if (p1.mapX === undefined || p2.mapX === undefined) return;

                let interpMapX = p1.mapX + (p2.mapX - p1.mapX) * localFrac;
                let interpMapZ = p1.mapZ + (p2.mapZ - p1.mapZ) * localFrac;

                let { cx, cy } = mapToCanvas(interpMapX, interpMapZ);

                topDownCtx.beginPath();
                topDownCtx.arc(cx, cy, isMe ? 5 : 4, 0, Math.PI*2);
                let color = isMe ? '#22c55e' : strToColor(uid);
                if (uid === 'GHOST') color = '#a855f7'; // Purple ghost
                
                topDownCtx.fillStyle = color;
                topDownCtx.fill();
                
                if(isMe) {
                    topDownCtx.strokeStyle = '#ffffff';
                    topDownCtx.lineWidth = 1.5;
                    topDownCtx.stroke();
                }
            });
        }

        // --- Web Bluetooth FTMS Control ---
        let btDevice = null;
        let ftmsControlChar = null;
        let lastPhysicsTime = performance.now();
        let pendingCommand = false;

        const uiMode = document.getElementById('ctrlMode');
        const uiPanelRes = document.getElementById('panelResistance');
        const uiPanelErg = document.getElementById('panelErg');
        const uiDiff = document.getElementById('ctrlDifficulty');
        const uiMaxPower = document.getElementById('ctrlMaxPower');
        
        uiMode.onchange = (e) => {
            if(!isHost) return;
            trackData.mode = e.target.value;
            updateUIForMode();
            drawEditor();
            rebuild3DTrack();
            syncLocalData();
        };

        document.getElementById('ctrlDifficulty').oninput = (e) => document.getElementById('diffVal').textContent = e.target.value;

        document.getElementById('btnConnectTrainer').onclick = async () => {
            if(!navigator.bluetooth) { alert("Web Bluetooth not supported"); return; }
            try {
                document.getElementById('statusText').textContent = "Scanning...";
                btDevice = await navigator.bluetooth.requestDevice({
                    filters: [{services: ['fitness_machine']}],
                    optionalServices: ['cycling_power']
                });
                
                btDevice.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('statusText').textContent = "Disconnected";
                    document.getElementById('statusDot').className = 'w-2.5 h-2.5 rounded-full bg-slate-500';
                    document.getElementById('btnConnectTrainer').classList.remove('hidden');
                    document.getElementById('btnDisconnectTrainer').classList.add('hidden');
                    ftmsControlChar = null;
                });

                document.getElementById('statusText').textContent = "Connecting...";
                const server = await btDevice.gatt.connect();
                const ftmsService = await server.getPrimaryService('fitness_machine');
                
                // Read Data
                const dataChar = await ftmsService.getCharacteristic('indoor_bike_data');
                await dataChar.startNotifications();
                dataChar.addEventListener('characteristicvaluechanged', parseFTMSData);

                // Control Point
                try {
                    ftmsControlChar = await ftmsService.getCharacteristic('fitness_machine_control_point');
                    await ftmsControlChar.startNotifications();
                    // Request control OpCode 0x00
                    await ftmsControlChar.writeValue(new Uint8Array([0x00]));
                } catch(e) { console.warn("Trainer does not support FTMS Control Point."); }

                document.getElementById('statusText').textContent = "Connected";
                document.getElementById('statusDot').className = 'w-2.5 h-2.5 rounded-full bg-green-500 glow-green';
                document.getElementById('btnConnectTrainer').classList.add('hidden');
                document.getElementById('btnDisconnectTrainer').classList.remove('hidden');
            } catch(e) {
                console.error(e);
                document.getElementById('statusText').textContent = "Failed";
            }
        };

        document.getElementById('btnDisconnectTrainer').onclick = () => {
            if(btDevice?.gatt.connected) {
                btDevice.gatt.disconnect();
            }
        };

        function parseFTMSData(event) {
            const data = event.target.value;
            const flags = data.getUint16(0, true);
            let offset = 2;

            if ((flags & 0x01) === 0) { // Instantaneous Speed
                localMetrics.speed = data.getUint16(offset, true) / 100;
                offset += 2;
            }
            if (flags & 0x02) offset += 2; // Average Speed
            if (flags & 0x04) { // Instantaneous Cadence
                localMetrics.cadence = Math.round(data.getUint16(offset, true) / 2);
                offset += 2;
            }
            if (flags & 0x08) offset += 2;
            if (flags & 0x10) offset += 3;
            if (flags & 0x20) offset += 2;
            if (flags & 0x40) { // Instantaneous Power
                localMetrics.power = data.getInt16(offset, true);
            }
        }

        async function updateTrainerResistance() {
            // Calc Gradient strictly from track data elevation (not the scaled 3D visual curve)
            let distFraction = Math.max(0, Math.min(1, localMetrics.distance / trackData.lengthKm));
            
            let p1 = trackData.points[0];
            let p2 = trackData.points[trackData.points.length - 1];
            
            for (let i = 0; i < trackData.points.length - 1; i++) {
                if (distFraction >= trackData.points[i].x && distFraction <= trackData.points[i+1].x) {
                    p1 = trackData.points[i];
                    p2 = trackData.points[i+1];
                    break;
                }
            }
            
            let dX = (p2.x - p1.x) * trackData.lengthKm * 1000; // run in meters
            let dY = 0; // rise in meters
            
            if (trackData.isGpxLoaded && p1.ele !== undefined && p2.ele !== undefined) {
                dY = p2.ele - p1.ele;
            } else {
                dY = p2.y - p1.y;
            }
            
            localMetrics.gradient = dX > 0 ? (dY / dX) * 100 : 0;

            // Pre-calculate targets for UI
            let currentTargetText = "0%";
            let targetRes = 0;
            let targetPower = 0;

            if(trackData.mode === 'resistance') {
                // Map gradient -30% to +30% into 0-100 resistance level
                let difficulty = parseInt(uiDiff.value) / 100;
                
                let mappedRes = ((localMetrics.gradient + 30) / 60) * 100;
                targetRes = Math.max(0, Math.min(100, Math.round(mappedRes * difficulty)));
                currentTargetText = `${targetRes}%`;
            } else {
                // ERG Mode based on Bar Graph
                let maxP = parseInt(uiMaxPower.value);
                
                let elapsed = localMetrics.time;
                
                let currentPowerPct = 0;
                let accum = 0;
                for (let seg of trackData.ergSegments) {
                    accum += seg.durationMin * 60;
                    if (elapsed <= accum) {
                        currentPowerPct = seg.powerPct;
                        break;
                    }
                }
                
                targetPower = Math.round(maxP * (currentPowerPct / 100));
                currentTargetText = `${targetPower} W`;
            }

            // Update UI Overlay
            const displayGrade = document.getElementById('displayGrade');
            const displayRes = document.getElementById('displayResistance');
            const labelRes = document.getElementById('labelResistance');
            if (displayGrade) displayGrade.textContent = `${localMetrics.gradient > 0 ? '+' : ''}${localMetrics.gradient.toFixed(1)}%`;
            if (displayRes) displayRes.textContent = currentTargetText;
            if (labelRes) labelRes.textContent = trackData.mode === 'resistance' ? 'Resistance' : 'Target Pwr';

            // Stop here if no trainer is connected or another BT command is writing
            if(!ftmsControlChar || pendingCommand) return;

            pendingCommand = true;
            try {
                if(trackData.mode === 'resistance') {
                    // OpCode 0x04 Set Target Resistance Level
                    await ftmsControlChar.writeValue(new Uint8Array([0x04, targetRes]));
                } else {
                    // OpCode 0x05 Set Target Power (SINT16)
                    const buffer = new ArrayBuffer(3);
                    const view = new DataView(buffer);
                    view.setUint8(0, 0x05);
                    view.setInt16(1, targetPower, true);
                    await ftmsControlChar.writeValue(buffer);
                }
            } catch(e) {
                // Ignore transient write errors
            } finally {
                setTimeout(() => pendingCommand = false, 1500); // Max 1 command per 1.5s
            }
        }

        // --- Main Game / Physics Loop ---
        let lastUIRenderTime = 0;

        function gameLoop(time) {
            if(!currentSessionId) return; // Stop if left session

            let dt = time - lastPhysicsTime;
            lastPhysicsTime = time;

            // Accumulate Time only when active
            if (isRideActive) {
                localMetrics.time += (dt / 1000);
            }

            // Physics Integration: Speed (km/h) to Distance (km)
            if(localMetrics.speed > 0 && isRideActive) {
                let speedMps = localMetrics.speed / 3.6;
                let distMeters = speedMps * (dt / 1000);
                localMetrics.distance += (distMeters / 1000);
                
                // Loop track
                if(localMetrics.distance > trackData.lengthKm) {
                    localMetrics.distance = 0; 
                }
            }
            
            // GPX Ghost Rider Logic
            if (isGhostEnabled && isRideActive && gpxTimestamps.length > 0) {
                let ghostTime = localMetrics.time;
                let ghostDist = 0;
                let ghostSpeed = 0;
                
                if (ghostTime >= gpxTimestamps[gpxTimestamps.length - 1].timeSec) {
                    ghostDist = gpxTimestamps[gpxTimestamps.length - 1].dist;
                } else {
                    for (let i = 0; i < gpxTimestamps.length - 1; i++) {
                        let p1 = gpxTimestamps[i];
                        let p2 = gpxTimestamps[i+1];
                        if (ghostTime >= p1.timeSec && ghostTime < p2.timeSec) {
                            let frac = (p2.timeSec - p1.timeSec) > 0 ? (ghostTime - p1.timeSec) / (p2.timeSec - p1.timeSec) : 0;
                            ghostDist = p1.dist + (p2.dist - p1.dist) * frac;
                            ghostSpeed = (p2.timeSec - p1.timeSec) > 0 ? ((p2.dist - p1.dist) / (p2.timeSec - p1.timeSec)) * 3600 : 0;
                            break;
                        }
                    }
                }
                
                // Keep ghost looped if track loops
                ghostDist = ghostDist % trackData.lengthKm;
                
                activeUsers['GHOST'] = {
                    distance: ghostDist,
                    time: ghostTime,
                    speed: ghostSpeed,
                    power: 0,
                    cadence: 0
                };
            }

            // Record session data every 1 second (1000ms)
            if (isRideActive && (time - lastRecordTime >= 1000)) {
                recordedData.push({
                    timestamp: new Date(),
                    distance: localMetrics.distance,
                    speed: localMetrics.speed,
                    power: localMetrics.power,
                    cadence: localMetrics.cadence
                });
                lastRecordTime = time;
            }

            // Sync metrics to UI/3D immediately for local player
            if(activeUsers[currentUserId]) {
                activeUsers[currentUserId].distance = localMetrics.distance;
                activeUsers[currentUserId].speed = localMetrics.speed;
                activeUsers[currentUserId].power = localMetrics.power;
                activeUsers[currentUserId].cadence = localMetrics.cadence;
                activeUsers[currentUserId].time = localMetrics.time;
            }

            // Dead reckoning for remote users & Avatar updates
            Object.keys(activeUsers).forEach(uid => {
                let user = activeUsers[uid];
                
                // Dead reckoning: smoothly extrapolate movement for other players between network updates
                if (uid !== currentUserId && user.speed > 0) {
                    let speedMps = user.speed / 3.6;
                    let distMeters = speedMps * (dt / 1000);
                    user.distance = (user.distance || 0) + (distMeters / 1000);
                    user.time = (user.time || 0) + (dt / 1000);
                    
                    if(user.distance > trackData.lengthKm) {
                        user.distance = 0;
                    }
                }
                
                // Update 3D avatar position smoothly every frame for everyone
                updateAvatar3D(uid, user.distance || 0, uid === currentUserId);
            });

            // Update UI Grid (Throttled to 200ms to avoid DOM thrashing, feels instant)
            if (time - lastUIRenderTime > 200) {
                renderGrid(); 
                if (trackData.mode === 'erg') drawEditor(); // Continuously update progress bar
                lastUIRenderTime = time;
            }

            drawMinimap(); // Render 2D Minimap
            drawTopDownMinimap(); // Render 2D Top-down GPX Minimap

            // Render 3D
            if(renderer && scene && camera) {
                renderer.render(scene, camera);
            }

            syncLocalData();
            updateTrainerResistance();

            requestAnimationFrame(gameLoop);
        }

        // Kick off Auth
        window.onload = initAuth;

    </script>
</body>
</html>
